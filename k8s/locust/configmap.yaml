apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-script
  namespace: mlops
data:
  locustfile.py: |
    from __future__ import annotations
    import random
    from locust import HttpUser, between, task

    _CITIES = ["Hartford", "Greenwich", "New Haven", "Stamford", "Bridgeport", "San Juan", "Dorado"]
    _STATES = ["Connecticut", "New York", "California", "Texas", "Florida", "Puerto Rico"]
    _STATUS = ["for_sale", "sold"]

    class PredictUser(HttpUser):
        wait_time = between(0.1, 0.5)

        @task
        def predict(self) -> None:
            payload = {
                "bed": float(random.randint(1, 6)),
                "bath": float(random.randint(1, 4)),
                "acre_lot": round(random.uniform(0.05, 5.0), 2),
                "house_size": float(random.randint(500, 5000)),
                "city": random.choice(_CITIES),
                "state": random.choice(_STATES),
                "status": random.choice(_STATUS),
                "zip_code": str(random.randint(1000, 99999)),
                "prev_sold_year": float(random.randint(1990, 2025)),
            }
            with self.client.post(
                "/predict",
                json={"features": payload},
                catch_response=True,
            ) as resp:
                if resp.status_code == 200:
                    resp.success()
                else:
                    resp.failure(f"status={resp.status_code} body={resp.text[:120]}")

        @task(weight=1)
        def health(self) -> None:
            self.client.get("/health", name="/health")
