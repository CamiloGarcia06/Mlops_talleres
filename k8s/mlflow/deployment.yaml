apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.13.0
        command:
        - bash
        - -c
        - >-
          pip install --no-cache-dir psycopg2-binary boto3 &&
          mlflow server
          --backend-store-uri=postgresql://mlops_user:mlops_pass_2026@postgres-service:5432/mlflow_db
          --default-artifact-root=s3://mlflow-artifacts/
          --host=0.0.0.0
          --port=5000
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        envFrom:
        - configMapRef:
            name: mlflow-config
        - secretRef:
            name: mlflow-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10